[build-system]
requires = ["hatchling>=1.25"]
build-backend = "hatchling.build"

[project]
name = "olx-agent"
version = "0.2.0"
description = "Agent zakupowy dla OLX.pl: wyszukiwanie, analiza zdjęć i opisów, porównywanie, negocjacje i wsparcie decyzji — plugin dla aplikacji Claude (serwer MCP + skill) oraz CLI na Claude API."
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
dependencies = [
    "anthropic>=2.3.0",
    "anyio>=4.9",
    "httpx2>=2.13",
    "mcp>=2.3.0",
    "pillow>=10.0",
]

[project.optional-dependencies]
dev = ["pytest>=8"]

[project.scripts]
olx-agent = "olx_agent.cli:main"
olx-mcp = "olx_agent.mcp_server:main"

[tool.hatch.build.targets.wheel]
packages = ["src/olx_agent"]

[tool.pytest.ini_options]
testpaths = ["tests"]
